<script>
const Q = [

  { text: "Nếu có 24 giờ để tạo một sản phẩm mới, bạn ưu tiên…", opts: ["Nội dung thật nổi bật", "Sản phẩm giải quyết đúng nhu cầu", "Giao diện thật đẹp mắt", "Phân chia công việc hiệu quả"] },
  { text: "Bạn muốn được nhớ đến như một người…", opts: ["Truyền cảm hứng và sáng tạo", "Thông minh và hiểu khách hàng", "Có gu và khác biệt", "Đáng tin cậy và dẫn dắt tốt"] }
];

const TYPES = {
  A: { name: "Content Creator", color: "#E9A84C", bar: "#FAC775", emoji: "🌟" },
  B: { name: "Product Marketing", color: "#378ADD", bar: "#85B7EB", emoji: "📈" },
  C: { name: "Designer", color: "#D4537E", bar: "#ED93B1", emoji: "🎨" },
  D: { name: "Strategist", color: "#1D9E75", bar: "#5DCAA5", emoji: "🚀" }
};

const RESULTS = {
  A: {
    title: "Creative Storyteller",
    desc: "Bạn có khả năng kể chuyện, tạo cảm xúc và thu hút người khác bằng nội dung. Bạn không thích những thứ quá khuôn mẫu — thay vào đó, bạn thích tự do thể hiện cá tính qua video, caption, hình ảnh hoặc cách giao tiếp.",
    tags: ["Content Creator", "TikTok Creator", "Social Media Exec", "Copywriter", "MC / Host"],
    strengths: ["Nhiều ý tưởng", "Biết tạo cảm xúc", "Nhạy với xu hướng", "Kết nối mọi người"],
    grows: ["Lên kế hoạch dài hạn", "Quản lý thời gian"],

  },
  B: {
    title: "Insight Hunter",
    desc: "Bạn thích tìm hiểu con người, hành vi và cách tạo ra sản phẩm/chiến dịch phù hợp. Bạn có tư duy logic, nhìn được bức tranh lớn và thích giải quyết vấn đề một cách có chiến lược.",
    tags: ["Product Marketing", "Brand Strategist", "Planner", "Research & Insight", "Campaign Exec"],
    strengths: ["Tư duy logic", "Hiểu khách hàng", "Chiến lược tốt", "Nhìn bức tranh lớn"],
    grows: ["Thực thi sáng tạo", "Kỹ năng visual"],

  },
  C: {
    title: "Visual Creator",
    desc: "Bạn cực kỳ nhạy cảm với hình ảnh, màu sắc và cảm xúc thị giác. Bạn hay chú ý những chi tiết mà người khác thường bỏ qua — và bạn có khả năng biến những thứ bình thường trở nên thu hút hơn.",
    tags: ["Graphic Designer", "UI/UX Designer", "Art Director", "Motion Designer", "Branding"],
    strengths: ["Gu thẩm mỹ mạnh", "Tinh tế chi tiết", "Sáng tạo hình ảnh", "Aesthetic cao"],
    grows: ["Kỹ năng thuyết trình", "Tư duy chiến lược"],
    quote: "Bạn có khả năng khiến mọi người dừng lại để nhìn."
  },
  D: {
    title: "The Organizer",
    desc: "Bạn giỏi kết nối ý tưởng, con người và kế hoạch để mọi thứ vận hành trơn tru. Bạn đáng tin cậy, bình tĩnh và có tư duy hệ thống — đó là những phẩm chất hiếm trong môi trường sáng tạo.",
    tags: ["Project Manager", "Creative Planner", "Producer", "Account Manager", "Team Lead"],
    strengths: ["Tổ chức tốt", "Đáng tin cậy", "Tư duy hệ thống", "Dẫn dắt team"],
    grows: ["Linh hoạt hơn", "Sáng tạo tự do"],
    quote: "Bạn có khả năng khiến một team hoạt động hiệu quả hơn rất nhiều."
  }

const COMBOS = {
  AC: { title: "Visual Storyteller", desc: "Bạn vừa sáng tạo nội dung vừa có gu thẩm mỹ mạnh. Không chỉ nghĩ ra ý tưởng hay — bạn còn muốn nó phải đẹp, thu hút và có cảm xúc. Bạn thường mê edit video, chú ý màu sắc và thích biến ý tưởng thành hình ảnh thực tế.", tags: ["Content Creator", "Video Editor", "Graphic Designer", "Creative Designer", "Art Creator"] },
  CA: { title: "Visual Storyteller", desc: "Bạn vừa sáng tạo nội dung vừa có gu thẩm mỹ mạnh. Không chỉ nghĩ ra ý tưởng hay — bạn còn muốn nó phải đẹp, thu hút và có cảm xúc. Bạn thường mê edit video, chú ý màu sắc và thích biến ý tưởng thành hình ảnh thực tế.", tags: ["Content Creator", "Video Editor", "Graphic Designer", "Creative Designer", "Art Creator"] },
  BD: { title: "Insight Builder", desc: "Bạn không chỉ có tư duy chiến lược mà còn hiểu cách mọi người suy nghĩ và hành động. Bạn thích quan sát, phân tích và làm việc rất có kế hoạch — nhưng luôn hướng đến kết quả thực tế.", tags: ["Product Marketing", "Brand Strategist", "Planner", "Project Coordinator", "Campaign Exec"] },
  DB: { title: "Insight Builder", desc: "Bạn không chỉ có tư duy chiến lược mà còn hiểu cách mọi người suy nghĩ và hành động. Bạn thích quan sát, phân tích và làm việc rất có kế hoạch — nhưng luôn hướng đến kết quả thực tế.", tags: ["Product Marketing", "Brand Strategist", "Planner", "Project Coordinator", "Campaign Exec"] }
};

let cur = 0, scores = { A: 0, B: 0, C: 0, D: 0 }, chosen = [];

function startQuiz() {
  cur = 0; scores = { A: 0, B: 0, C: 0, D: 0 }; chosen = [];
  show('screen-quiz');
  renderQ();
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQ() {
  const q = Q[cur];
  document.getElementById('prog-label').textContent = `Câu ${cur+1}/10`;
  document.getElementById('prog-fill').style.width = `${(cur+1)*10}%`;
  document.getElementById('q-num').textContent = `CÂU HỎI ${String(cur+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.text;
  const keys = ['A','B','C','D'];
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.innerHTML = `<span class="opt-key">${keys[i]}</span><span>${o}</span>`;
    b.onclick = () => pick(keys[i], b);
    opts.appendChild(b);
  });
}

function pick(key, btn) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  setTimeout(() => {
    scores[key]++;
    chosen.push(key);
    cur++;
    if (cur >= 10) showResult();
    else renderQ();
  }, 280);
}

function showResult() {
  show('screen-result');
  const total = 10;
  const pcts = {};
  ['A','B','C','D'].forEach(k => pcts[k] = Math.round(scores[k] / total * 100));

  const sorted = Object.entries(pcts).sort((a,b) => b[1]-a[1]);
  const top = sorted[0], second = sorted[1];
  const topKey = top[0], topPct = top[1], secKey = second[0], secPct = second[1];

  let profile, isMulti = false;
  const isCombo = secPct >= 30 && (topPct - secPct) <= 20;
  const isBalanced = sorted.every(([,p]) => p >= 15 && p <= 35);

  if (isBalanced) { isMulti = true; }
  else if (isCombo && COMBOS[topKey+secKey]) { profile = COMBOS[topKey+secKey]; }
  else { profile = RESULTS[topKey]; }

  const html = buildResult(pcts, sorted, topKey, secKey, profile, isMulti);
  document.getElementById('result-content').innerHTML = html;

  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.w + '%';
    });
  }, 80);
}

function buildResult(pcts, sorted, topKey, secKey, profile, isMulti) {
  const T = TYPES[topKey];
  const barColors = { A: '#FAC775', B: '#85B7EB', C: '#ED93B1', D: '#5DCAA5' };

  let barsHtml = sorted.map(([k, p]) =>
    `<div class="bar-row">
      <div class="bar-label"><span class="bar-name" style="color:${TYPES[k].color}">${TYPES[k].emoji} ${TYPES[k].name}</span><span class="bar-pct">${p}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="background:${barColors[k]};width:0%" data-w="${p}"></div></div>
    </div>`
  ).join('');

  if (isMulti) {
    return `
    <div class="result-header">
      <div class="result-emoji">✨</div>
      <div class="result-title">Multi-Creative</div>
      <div class="result-sub">Bạn không thể bị đóng khung vào một nghề!</div>
    </div>
    <div class="bars-section">${barsHtml}</div>
    <div class="result-desc"><p>Bạn là kiểu người đa năng trong môi trường sáng tạo. Bạn có thể thích nhiều vai trò cùng lúc và dễ thích nghi với nhiều công việc khác nhau — vừa có tư duy sáng tạo, khả năng thẩm mỹ, suy nghĩ chiến lược và khả năng phối hợp tốt. Điều đó hoàn toàn bình thường và là lợi thế!</p></div>
    <div class="tags-section"><div class="tags-title">✦ Bạn phù hợp với</div><div class="tags">${["Creative Team","Startup Env","Agency","Multimedia","Campaign Team"].map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    <div class="quote-box"><p>"Bạn học nhanh và thích nghi rất tốt. Hãy thử nhiều vai trò để tìm ra chất riêng mạnh nhất của mình."</p></div>
    <button class="btn-retry" onclick="startQuiz()"><i class="ti ti-refresh" aria-hidden="true"></i> Thử lại nào!</button>`;
  }

  const r = profile;
  const secRole = TYPES[secKey];
  const secPct = pcts[secKey];

  return `
  <div class="result-header">
    <div class="result-emoji">${T.emoji}</div>
    <div class="result-title">${r.title}</div>
    <div class="result-sub">${T.name} ${sorted[0][1]}%</div>
  </div>
  <div class="bars-section">${barsHtml}</div>
  <div class="result-desc"><p>${r.desc}</p></div>
  <div class="tags-section"><div class="tags-title">✦ Bạn phù hợp với</div><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
  <div class="strengths">
    <div class="str-card"><div class="str-card-title">ĐIỂM MẠNH</div><ul>${r.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="str-card"><div class="str-card-title">CẦN PHÁT TRIỂN</div><ul>${r.grows.map(s=>`<li>${s}</li>`).join('')}</ul></div>
  </div>
  ${secPct >= 20 ? `<div class="secondary-role"><span class="secondary-role-icon">${secRole.emoji}</span><div class="secondary-role-text"><strong>Secondary role: ${secRole.name} (${secPct}%)</strong>Bạn cũng có tố chất ${secRole.name} khá mạnh — đó là combo đáng giá!</div></div>` : ''}
  <div class="quote-box"><p>"${r.quote}"</p></div>
  <button class="btn-retry" onclick="startQuiz()"><i class="ti ti-refresh" aria-hidden="true"></i> Thử lại nào!</button>`;
}
</script>
